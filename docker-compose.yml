services:
  postgres:
    image: postgres:16-alpine
    container_name: fitlife_postgres
    restart: always
    environment:
      POSTGRES_USER: fitlife_user
      POSTGRES_PASSWORD: fitlife_password
      POSTGRES_DB: fitlife_db
    ports:
      - "5433:5432"
    volumes:
      - fitlife_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitlife_user -d fitlife_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fitlife_pgdata:
    driver: local
